name: Generate authentic product hero imagery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/compose_real_hero.py'
      - '.github/workflows/real-hero-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Compose hero from actual product photos
        run: python scripts/compose_real_hero.py
      - name: Check WebP sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in sorted(Path('public/assets/hero').glob('phungha-real-products-hero-*.webp')):
              im=Image.open(p)
              print(p, im.size, p.stat().st_size)
              assert p.stat().st_size < 400_000
          PY
      - name: Commit approved real-product assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/hero/
          if ! git diff --cached --quiet; then
            git commit -m "assets(hero): publish genuine-fanpage-product composite WebP"
            git push
          fi
